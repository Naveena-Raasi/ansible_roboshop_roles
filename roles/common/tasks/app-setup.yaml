- name: create user
  ansible.builtin.user:
    name: roboshop
    system: true
    home: /app
    shell: /sbin/nologin
    comment: roboshop system user

#safe to remove the existing directory to create it freshly to avoid incovinience
- name: remove app directory
  ansible.builtin.file: 
    path: /app
    state: absent

- name: create app directory
  ansible.builtin.file: 
    state: directory
    path: /app

- name: remove {{ component }} file
  ansible.builtin.file: 
    path: /tmp/{{ component }}.zip
    state: absent

- name: download {{ component }} file
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip
    dest: /tmp/{{ component }}.zip

- name: Unarchive {{ component }} file
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes